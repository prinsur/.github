name: PR Title Lint (Reusable)

on:
  workflow_call:
    inputs:
      scopes:
        description: |
          Multi-line list of allowed scopes for this repo.
          Each line is one scope. See docs/commit-scopes.md.
          Leave empty to allow any scope (規範允許 scope 省略).
        required: false
        type: string
        default: ""

jobs:
  lint:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: ${{ inputs.scopes }}
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
            See commit conventions at https://github.com/prinsur/.github/blob/main/docs/commit-tags.md
          validateSingleCommit: false
